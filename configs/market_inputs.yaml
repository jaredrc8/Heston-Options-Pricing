# Rate and dividend inputs (SPEC.md 4.3).
# U.S. Treasury 1-Year CMT par yield, as a decimal. The code converts it to r = 2 ln(1 + y / 2).
# Source: U.S. Department of the Treasury, Daily Treasury Par Yield Curve Rates, October 2026
# (home.treasury.gov). 2026-10-14 was entered by the owner and matches that table.
treasury_1y_cmt_yield:
  2026-10-13: 0.0448
  2026-10-14: 0.0453
  2026-10-15: 0.0449
  2026-11-06: 0.0433    # for the GOOG market comparison (SPEC.md 8.4)

# q_AMD = 0 is stated in SPEC.md 4.3.
# q_INTC = 0 is the default in SPEC.md 4.3.
# q_NVDA: declared $0.25 quarterly dividend (NVIDIA Q1 fiscal 2027 results), annualized to $1.00,
# divided by a reported 2026-10-14 close of about $221.30 and rounded to 0.0001 (SPEC.md 4.3).
dividend_yield:
  AMD: 0.0
  INTC: 0.0
  NVDA: 0.0045
